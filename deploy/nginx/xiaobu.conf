server {
    # Retain HTTP while prototype records still live in browser storage.
    # HTTP and HTTPS have separate localStorage and IndexedDB origins.
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name 14.103.24.55;
    server_tokens off;
    access_log off;
    error_log syslog:server=127.0.0.1:13092,tag=xiaobu_gateway error;

    ssl_certificate /etc/letsencrypt/live/14.103.24.55/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/14.103.24.55/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:XiaobuSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/xiaobu-assistant.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/xiaobu-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        gzip on;
        gzip_types text/css text/javascript application/javascript;
        gzip_vary on;

        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
