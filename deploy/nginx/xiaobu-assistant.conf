# Included inside the existing IP server block.
location ^~ /assistant-api/ {
    if ($scheme != https) { return 426; }
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:3091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 100s;
    access_log off;
}

# Streaming originals: independent from the assistant's small audio/text limit.
location ^~ /assistant-api/learning/ {
    if ($scheme != https) { return 426; }
    client_max_body_size 21m;
    client_body_timeout 180s;
    proxy_pass http://127.0.0.1:3091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    access_log off;
}

# Reading logs optionally include one compressed book-page JPEG encoded in JSON.
location ^~ /assistant-api/reading/ {
    if ($scheme != https) { return 426; }
    client_max_body_size 4m;
    proxy_pass http://127.0.0.1:3091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 100s;
    access_log off;
}
